# Configuración única para Tarea 1 (RAG Normativo).
# Nada en src/ debe leer valores fuera de este archivo (excepto secretos, que van en .env).

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  docs_dir: "docs"
  extracted_pages_file: "data/processed/paginas_extraidas.jsonl"
  cleaned_pages_file: "data/processed/paginas_limpias.jsonl"
  extraction_report_file: "docs/reporte_extraccion.md"
  indexing_report_file: "docs/reporte_indexacion.md"
  chunks_file: "data/processed/chunks.jsonl"
  index_file: "data/processed/vector_index.pkl"
  logs_dir: "logs"
  cost_log: "logs/cost_log.csv"

documents:
  - id: "ley_32069"
    file: "LEY_32069.pdf"
    titulo: "Ley N.° 32069, Ley General de Contrataciones Públicas"
    version: "2024-06-18"
    ley_ds: "LEY"
  - id: "ds_001_2026_ef"
    file: "DS_001_2026_EF.pdf"
    titulo: "D.S. N.° 001-2026-EF, Reglamento de la Ley N.° 32069"
    version: "2026-01-01"
    ley_ds: "DS"

extraction:
  # Detección de layout a dos columnas (formato Diario Oficial El Peruano).
  # header_band_ratio/footer_band_ratio excluyen la cabecera/pie del análisis
  # del gutter para que una cabecera a todo lo ancho no oculte la franja vacía
  # real entre columnas del cuerpo de la página.
  column_detection:
    header_band_ratio: 0.10
    footer_band_ratio: 0.05
    histogram_bins: 100
    gap_search_min_ratio: 0.30
    gap_search_max_ratio: 0.70
    max_density_per_bin: 1
    min_gap_width_ratio: 0.015

chunking:
  # Fragmentación guiada por estructura legal (Título > Artículo > Numeral >
  # Inciso, ver src/chunker.py). max_chunk_tokens/token_fallback_overlap_tokens
  # solo se usan como red de seguridad si un fragmento estructural (p. ej. un
  # artículo o inciso con una lista extensa) excede el tamaño manejable; en
  # ese caso se subdivide con una ventana de tokens con solape.
  #
  # max_chunk_tokens=110 se calibró originalmente contra el tokenizer real de
  # sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 (max_seq_length
  # de 128 subtokens WordPiece): con 400 (pensado para presupuesto de contexto
  # de LLM, no de embeddings) el 23.1% de los fragmentos superaba los 128
  # subtokens y el modelo los truncaba en silencio antes de generar el
  # embedding. El modelo de producción actual (BAAI/bge-m3, ver
  # embeddings.local_model) tiene max_seq_length=8192, muy por encima de 110
  # tokens cl100k, así que ya no hay riesgo de truncamiento con ningún
  # artículo/numeral/inciso real de estos documentos; se mantiene 110 porque
  # sigue produciendo fragmentos de tamaño legalmente coherente. Si se cambia
  # embeddings.local_model por uno con un max_seq_length más bajo, recalibrar
  # este valor contra su tokenizer real antes de reindexar.
  max_chunk_tokens: 110
  token_fallback_overlap_tokens: 20
  encoding_name: "cl100k_base"

embeddings:
  # Ver eval/resultados.csv y docs/reporte_embeddings.md para la comparativa
  # que decide estos valores; query_prefix/passage_prefix son obligatorios
  # para modelos E5 (intfloat/multilingual-e5-*), que rinden mal sin ellos.
  # BAAI/bge-m3 ganó la comparativa (Recall@5=92.3%, MRR=0.846, meta >=80%)
  # frente al baseline MiniLM (76.9%/0.576) y a multilingual-e5-base
  # (84.6%/0.767); no requiere prefijos para este resultado. dim=1024,
  # max_seq_length=8192 (muy por encima de chunking.max_chunk_tokens=110,
  # sin riesgo de truncamiento).
  provider: "local"                 # local | openai
  local_model: "BAAI/bge-m3"
  openai_model: "text-embedding-3-small"
  query_prefix: ""
  passage_prefix: ""
  batch_size: 16

llm:
  provider: "anthropic"
  model: "claude-sonnet-5"
  max_tokens: 1024
  # No se envía a la API: el SDK anthropic instalado (1.6.0) no expone un
  # parámetro temperature en Messages.create (verificado con
  # inspect.signature). Se deja documentado por si una versión futura del
  # SDK lo reincorpora.
  temperature: 0.0
  price_input_per_1k_usd: 0.003
  price_output_per_1k_usd: 0.015
  system_prompt: >
    Eres un asistente legal especializado en contrataciones públicas del Perú.
    Responde EXCLUSIVAMENTE con base en los fragmentos de contexto proporcionados.
    Cada fragmento de contexto trae entre corchetes su cita completa (documento,
    página y, cuando aplica, título/artículo/numeral/inciso). Para CADA afirmación
    de tu respuesta debes citar entre paréntesis, inmediatamente después, al menos
    el artículo y la página de origen, agregando numeral/inciso cuando el
    fragmento los indique. Ejemplo de formato: "El objeto de la ley es
    establecer el marco normativo de contrataciones (Artículo 1, pág. 1)."
    No agrupes todas las citas al final: cita junto a cada afirmación. Si el
    contexto no sustenta la respuesta, indícalo explícitamente en vez de
    inventar información o inventar una cita.
  citation_retry_message: >
    Tu respuesta anterior no incluyó una cita explícita de artículo y página
    para alguna afirmación. Reescribe la respuesta completa citando, entre
    paréntesis y junto a cada afirmación, el artículo y la página exactos del
    fragmento de contexto que la sustenta (agrega numeral/inciso cuando el
    fragmento los indique). No agregues información nueva.

retrieval:
  top_k: 5
  similarity_threshold: 0.35
  abstention_message: "No cuento con evidencia suficiente en la Ley N.° 32069 ni en el D.S. N.° 001-2026-EF para responder con certeza esta pregunta. Por favor reformúlela o consulte directamente el texto normativo."

evaluation:
  questions_file: "eval/preguntas.csv"
  results_file: "eval/resultados.csv"
  target_recall_at_k: 0.80
  # Candidatos para la comparativa de embeddings (eval/evaluate_retrieval.py).
  # text-embedding-3-small (OpenAI) se dejó fuera porque OPENAI_API_KEY no
  # está configurado en este entorno; en su lugar se comparan dos modelos
  # multilingües locales de mayor capacidad que el baseline (costo cero).
  # Los modelos E5 se entrenaron con los prefijos "query: "/"passage: " y
  # rinden notablemente peor sin ellos, por eso son parte de cada candidato.
  embedding_candidates:
    - name: "local_minilm_baseline"
      provider: "local"
      model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      query_prefix: ""
      passage_prefix: ""
    - name: "local_multilingual_e5_base"
      provider: "local"
      model: "intfloat/multilingual-e5-base"
      query_prefix: "query: "
      passage_prefix: "passage: "
    - name: "local_bge_m3"
      provider: "local"
      model: "BAAI/bge-m3"
      query_prefix: ""
      passage_prefix: ""
