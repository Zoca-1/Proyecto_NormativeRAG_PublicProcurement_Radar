# Configuración única para Tarea 1 (RAG Normativo).
# Nada en src/ debe leer valores fuera de este archivo (excepto secretos, que van en .env).

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  docs_dir: "docs"
  extracted_pages_file: "data/processed/paginas_extraidas.jsonl"
  cleaned_pages_file: "data/processed/paginas_limpias.jsonl"
  extraction_report_file: "docs/reporte_extraccion.md"
  indexing_report_file: "docs/reporte_indexacion.md"
  chunks_file: "data/processed/chunks.jsonl"
  index_file: "data/processed/vector_index.pkl"
  logs_dir: "logs"
  cost_log: "logs/cost_log.csv"

documents:
  - id: "ley_32069"
    file: "LEY_32069.pdf"
    titulo: "Ley N.° 32069, Ley General de Contrataciones Públicas"
    version: "2024-06-18"
    ley_ds: "LEY"
  - id: "ds_001_2026_ef"
    file: "DS_001_2026_EF.pdf"
    titulo: "D.S. N.° 001-2026-EF, Reglamento de la Ley N.° 32069"
    version: "2026-01-01"
    ley_ds: "DS"

extraction:
  # Detección de layout a dos columnas (formato Diario Oficial El Peruano).
  # header_band_ratio/footer_band_ratio excluyen la cabecera/pie del análisis
  # del gutter para que una cabecera a todo lo ancho no oculte la franja vacía
  # real entre columnas del cuerpo de la página.
  column_detection:
    header_band_ratio: 0.10
    footer_band_ratio: 0.05
    histogram_bins: 100
    gap_search_min_ratio: 0.30
    gap_search_max_ratio: 0.70
    max_density_per_bin: 1
    min_gap_width_ratio: 0.015

chunking:
  # Fragmentación guiada por estructura legal (Título > Artículo > Numeral >
  # Inciso, ver src/chunker.py). max_chunk_tokens/token_fallback_overlap_tokens
  # solo se usan como red de seguridad si un fragmento estructural (p. ej. un
  # artículo o inciso con una lista extensa) excede el tamaño manejable; en
  # ese caso se subdivide con una ventana de tokens con solape.
  #
  # max_chunk_tokens=110 se calibró empíricamente contra el tokenizer real del
  # modelo de embeddings configurado abajo (embeddings.local_model), cuyo
  # max_seq_length es 128 subtokens WordPiece: con el valor previo (400,
  # pensado para presupuesto de contexto de LLM) el 23.1% de los fragmentos
  # (181/784) superaba los 128 subtokens y el modelo los truncaba en
  # silencio antes de generar el embedding, perdiendo el contenido posterior
  # al corte en la similitud de recuperación. Con 110 tokens cl100k, el
  # fragmento WordPiece más largo observado es 102 (0% de truncamiento).
  # Si se cambia embeddings.local_model por uno con otro max_seq_length,
  # recalibrar este valor contra su tokenizer real antes de reindexar.
  max_chunk_tokens: 110
  token_fallback_overlap_tokens: 20
  encoding_name: "cl100k_base"

embeddings:
  provider: "local"                 # local | anthropic | openai
  local_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  openai_model: "text-embedding-3-small"
  batch_size: 16

llm:
  provider: "anthropic"
  model: "claude-sonnet-5"
  max_tokens: 1024
  temperature: 0.0
  price_input_per_1k_usd: 0.003
  price_output_per_1k_usd: 0.015
  system_prompt: >
    Eres un asistente legal especializado en contrataciones públicas del Perú.
    Responde EXCLUSIVAMENTE con base en los fragmentos de contexto proporcionados,
    citando siempre el documento, la página y, cuando el fragmento lo indique,
    el artículo/numeral/inciso exacto de cada afirmación. Si el contexto no
    sustenta la respuesta, indícalo explícitamente en vez de inventar información.

retrieval:
  top_k: 5
  similarity_threshold: 0.35
  abstention_message: "No cuento con evidencia suficiente en la Ley N.° 32069 ni en el D.S. N.° 001-2026-EF para responder con certeza esta pregunta. Por favor reformúlela o consulte directamente el texto normativo."

evaluation:
  questions_file: "eval/preguntas.csv"
  results_file: "eval/resultados.csv"
  embedding_providers_to_compare: ["local"]
